name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm run install:ci
      - run: npm run type-check
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Upload test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: error
          retention-days: 7
      - run: npm run evaluate -- --strict
      - run: npm run evaluate:triage:offline -- --strict
      - run: npm run lint
      - run: npm run extension:build
      - run: git diff --exit-code -- extension/shared-analysis.js extension/shared-provider.js
      - name: Run production build
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.log
      - name: Upload build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: build-output.log
          if-no-files-found: error
          retention-days: 7
      - run: git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm run install:ci
      - run: npx playwright install --with-deps chromium
      # The browser suite is the only check that exercises the shipped UI:
      # hydration races and ambiguous locators have broken it before while
      # every other gate stayed green. The dev server boots itself through
      # the Playwright webServer config; no credentials or network needed.
      - name: Run browser tests
        id: e2e
        shell: bash
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee e2e-output.log
      - name: Upload browser diagnostics
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: |
            e2e-output.log
            test-results/
          if-no-files-found: error
          retention-days: 7
