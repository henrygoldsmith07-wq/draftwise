name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm test
      - run: npm run evaluate -- --strict
      - run: npm run evaluate:triage:offline -- --strict
      - run: npm run lint
      - run: npm run extension:build
      - run: git diff --exit-code -- extension/shared-analysis.js extension/shared-provider.js
      - run: npm run build
      - run: git diff --exit-code
