name: Live triage evaluation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of corpus entries to evaluate (blank means all)"
        required: false
        default: ""
      benchmark_batching:
        description: "Also benchmark classifier batches of 5, 10, 25, 50, and 100"
        required: false
        type: boolean
        default: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run live classifier evaluation
        env:
          CLASSIFIER_API_KEY: ${{ secrets.CLASSIFIER_API_KEY }}
          CLASSIFIER_BASE_URL: ${{ secrets.CLASSIFIER_BASE_URL }}
        run: |
          args=""
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit=${{ inputs.limit }}"; fi
          if [ "${{ inputs.benchmark_batching }}" = "true" ]; then args="$args --benchmark-batching"; fi
          if [ -z "${{ inputs.limit }}" ]; then args="$args --strict"; fi
          node --experimental-strip-types scripts/evaluate-triage-live.mjs $args > triage-live-report.json
      - name: Upload live evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-live-report
          path: triage-live-report.json
          if-no-files-found: warn
