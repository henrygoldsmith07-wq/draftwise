<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draftwise</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #1b312b;
        background: #f5f8f6;
        color-scheme: light;
        --ink: #1b312b;
        --soft: #6d8177;
        --border: #dfe8e1;
        --card: #fff;
        --accent: #173f38;
        --lime: #d8f26b;
      }
      * { box-sizing: border-box; }
      body { margin: 0; width: 340px; max-height: 520px; overflow: auto; background: var(--card); }
      .dw-popup { display: grid; gap: 0; }
      .dw-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
      .dw-mark { width: 18px; height: 18px; border-radius: 6px; background: var(--accent); position: relative; flex: none; }
      .dw-mark:after { content: ""; position: absolute; left: 5px; right: 4px; top: 5px; height: 2px; background: var(--lime); box-shadow: 0 4px var(--lime), 0 8px var(--lime); }
      .dw-title { font-weight: 800; font-size: 13px; color: var(--ink); }
      .dw-source { padding: 2px 6px; border-radius: 5px; background: #edf5e5; color: #638744; font-size: 10px; font-weight: 700; }
      .dw-count { margin-left: auto; color: var(--soft); font-size: 11px; }
      .dw-body { padding: 4px 14px 10px; }
      .dw-empty { padding: 18px 2px; color: var(--soft); font-size: 12px; line-height: 1.5; }
      .dw-empty strong { display: block; color: var(--ink); font-size: 12.5px; margin-bottom: 4px; }
      .dw-issue { padding: 11px 0; border-bottom: 1px solid var(--border); }
      .dw-issue:last-child { border-bottom: 0; }
      .dw-issue-title { display: flex; align-items: center; gap: 6px; font-weight: 750; font-size: 12px; color: var(--ink); }
      .dw-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot, #759c83); flex: none; }
      .dw-meta { margin: 3px 0 5px; color: var(--soft); font-size: 10.5px; text-transform: capitalize; }
      .dw-copy { margin: 0; color: #5d7268; font-size: 11.5px; line-height: 1.45; }
      .dw-fix { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      .dw-old { color: #bd646a; text-decoration: line-through; overflow-wrap: anywhere; font-size: 11.5px; }
      .dw-new { color: #4c9066; font-weight: 750; overflow-wrap: anywhere; font-size: 11.5px; }
      .dw-accept { border: 0; border-radius: 7px; padding: 4px 9px; background: var(--accent); color: var(--lime); font-size: 11px; font-weight: 750; cursor: pointer; }
      .dw-dismiss { border: 0; background: transparent; color: var(--soft); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; }
      .dw-foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); background: #f7faf8; }
      .dw-foot button { border: 0; background: transparent; color: #4a7a63; font-size: 11px; font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; padding: 0; }
      .dw-foot .dw-foot-right { margin-left: auto; }
      .dw-status { padding: 10px 2px; color: var(--soft); font-size: 11.5px; }
      button:focus-visible { outline: 2px solid #91bdf7; outline-offset: 2px; border-radius: 6px; }
      @media (prefers-color-scheme: dark) {
        :root { color: #eff8ef; background: #12231f; color-scheme: dark; --ink: #eff8ef; --soft: #a7beb1; --border: #315049; --card: #18322f; --accent: #d8f26b; --lime: #173f38; }
        .dw-source { background: #1d4034; color: #cde9cf; }
        .dw-copy { color: #a7beb1; }
        .dw-foot { background: #142924; }
        .dw-accept { background: var(--accent); color: var(--lime); }
        .dw-foot button { color: #9fd0ae; }
      }
    </style>
  </head>
  <body>
    <div class="dw-popup">
      <header class="dw-head">
        <span class="dw-mark" aria-hidden="true"></span>
        <span class="dw-title">draftwise</span>
        <span class="dw-source" id="source">Local</span>
        <span class="dw-count" id="count"></span>
      </header>
      <div class="dw-body" id="body" role="region" aria-label="Draftwise suggestions"></div>
      <footer class="dw-foot">
        <button type="button" id="settings">Extension settings</button>
        <button type="button" id="disable-site" class="dw-foot-right" hidden>Disable on this site</button>
      </footer>
    </div>
    <script src="popup-logic.js"></script><script src="popup.js"></script>
  </body>
</html>
